server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versão do nginx nos headers e páginas de erro
    server_tokens off;

    # ---------- Headers de segurança ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Bloqueia acesso a dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Cache moderado para JS/CSS (evita servir versão velha por muito tempo)
    location ~* \.(js|css)$ {
        expires 1h;
    }

    # Cache longo para imagens e fontes
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
    }

    # HTML nunca em cache (atualizações aparecem na hora)
    location ~* \.html$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
